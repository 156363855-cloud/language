<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">广播记词</title>
  <desc id="desc">A rounded square icon with a radio, headphones, and language badges for English, Japanese, and Chinese.</desc>
  <defs>
